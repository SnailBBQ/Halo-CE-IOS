name: Halo CE iOS — Memory and diagnostics tests

# Fast checks (about a minute, no iOS toolchain) of the guest address-space allocator, the release of freed memory,
# and the log report. They also run as part of "Halo CE iOS — Build IPA" when that workflow includes them.
on:
  workflow_call:
  workflow_dispatch:

jobs:
  test:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run the tests
        run: |
          set -euxo pipefail
          python3 tools/tests/test_ios_declaration_order.py
          cc -std=gnu11 -O1 -Wall -Wextra -Wno-unused-function -Wno-unused-variable -Iport/ios/HaloIOS \
            tools/tests/test_ios_guest_vm.c -o "$RUNNER_TEMP/halo-vm-test"
          "$RUNNER_TEMP/halo-vm-test"
          cc -std=gnu11 -Wall -Wextra -Wno-unused-function tools/tests/test_ios_image_load.c -o "$RUNNER_TEMP/halo-image-test"
          "$RUNNER_TEMP/halo-image-test"
          cc -std=c11 -Wall -Wextra -Werror -Iport/ios/HaloIOS tools/tests/test_ios_log_report.c -o "$RUNNER_TEMP/halo-report-test" -lm
          "$RUNNER_TEMP/halo-report-test"
          python3 tools/tests/test_ios_world_cheats.py
          python3 tools/tests/test_ios_grenade_giver.py
          python3 tools/tests/test_ios_powerups.py
          python3 tools/tests/test_ios_campaign_policy.py
          python3 tools/tests/test_ios_store_build_modes.py
          python3 tools/tests/test_ios_header_declarations.py
          python3 tools/tests/test_ios_frameworks_linked.py
          python3 tools/tests/test_ios_import_coverage.py
          for t in settings_core map_order pad_input color scancodes wireframe checkpoint; do
            cc -std=c11 -Wall -Wextra -Werror -Iport/ios/HaloIOS "tools/tests/test_ios_$t.c" -o "$RUNNER_TEMP/halo-$t-test" -lm
            "$RUNNER_TEMP/halo-$t-test"
          done
