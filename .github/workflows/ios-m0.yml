name: iOS M1 IPA

on:
  workflow_dispatch:
  push:
    paths:
      - 'port/ios/**'
      - '.github/workflows/ios-m0.yml'

jobs:
  build-ios-m1:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Apple toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          clang --version

      - name: Build device app
        run: |
          set -euxo pipefail
          rm -rf build/ios-m1
          xcodebuild \
            -project port/ios/HaloIOS.xcodeproj \
            -scheme HaloIOS \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$PWD/build/ios-m1/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Validate and ad-hoc sign with M1 memory entitlements
        run: |
          set -euxo pipefail
          APP=$(find build/ios-m1/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -type d -print -quit)
          test -n "$APP"
          EXECUTABLE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP/Info.plist")
          test "$EXECUTABLE" = "HaloIOS"
          test -f "$APP/$EXECUTABLE"
          test -x "$APP/$EXECUTABLE"
          /usr/bin/codesign --force --sign - \
            --entitlements port/ios/HaloIOS/HaloIOS.entitlements \
            --timestamp=none "$APP"
          /usr/bin/codesign --verify --verbose=2 "$APP"

      - name: Package Halo iOS M1.1 IPA
        run: |
          set -euxo pipefail
          APP=$(find build/ios-m1/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -type d -print -quit)
          test -n "$APP"
          rm -rf build/ios-m1/Payload
          mkdir -p build/ios-m1/Payload
          cp -R "$APP" build/ios-m1/Payload/
          cd build/ios-m1
          /usr/bin/zip -qry Halo-iOS-M1.1.ipa Payload
          /usr/bin/unzip -Z1 Halo-iOS-M1.1.ipa | grep -qx 'Payload/HaloIOS.app/Info.plist'
          /usr/bin/unzip -Z1 Halo-iOS-M1.1.ipa | grep -qx 'Payload/HaloIOS.app/HaloIOS'

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Halo-iOS-M1.1
          path: build/ios-m1/Halo-iOS-M1.1.ipa
          if-no-files-found: error
          retention-days: 14
