name: Halo CE iOS — Build IPA
run-name: Halo CE iOS — ${{ github.ref_name }} (run ${{ github.run_number }})

on:
  workflow_dispatch:
    inputs:
      compatibility_test:
        description: 'Mod Test app: a second app for large campaign maps. Same engine and cross-play. It does not replace Halo CE.'
        type: boolean
        default: false
      non_jailbreak:
        description: 'BETA - Non-Jailbreak Version: the official app plus address-space and JIT diagnostics and a fallback memory window, for installs not signed by TrollStore or a jailbreak. Same bundle ID. Manual builds only.'
        type: boolean
        default: false
      arena_fastpath:
        description: 'Pointer rewrite (recommended): rewrites guest loads and stores so pointers do not fault. Turn off only to compare with an older build.'
        type: boolean
        default: true
permissions:
  contents: read

concurrency:
  group: halo-ios-${{ inputs.non_jailbreak && 'non-jailbreak' || inputs.compatibility_test && 'modtest' || 'main' }}
  cancel-in-progress: true

jobs:
  diagnostics:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ios-memory-tests.yml

  build-arm64_32-guest:
    name: Build Halo engine guest
    if: github.ref == 'refs/heads/main'
    needs: diagnostics
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read

    steps:
      - name: Reject conflicting build flavors
        env:
          COMPATIBILITY_TEST: ${{ inputs.compatibility_test || false }}
          NON_JAILBREAK: ${{ inputs.non_jailbreak || false }}
        run: |
          if [ "$COMPATIBILITY_TEST" = true ] && [ "$NON_JAILBREAK" = true ]; then
            echo "::error::Choose either compatibility_test (Mod Test) or non_jailbreak, not both."
            exit 1
          fi

      - name: Install Ninja
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/tools"
          curl -fsSL -o "$RUNNER_TEMP/ninja.zip" \
            https://github.com/ninja-build/ninja/releases/download/v1.12.1/ninja-linux.zip
          unzip -q "$RUNNER_TEMP/ninja.zip" -d "$RUNNER_TEMP/tools"
          echo "$RUNNER_TEMP/tools" >> "$GITHUB_PATH"

      - name: Checkout
        uses: actions/checkout@v4


      - name: Verify iOS pointer conversion
        run: |
          set -euxo pipefail
          python3 tools/ios_upstream_acceptance.py --json "$RUNNER_TEMP/ios-upstream-acceptance.json"
          python3 tools/tests/test_ios_build_identity.py
          python3 tools/tests/test_ios_workflow_configuration.py
          python3 tools/tests/test_ios_source_structure.py
          python3 tools/tests/test_ios_guest_compile_dependencies.py
          python3 tools/tests/test_ios_guest_return_contracts.py
          python3 tools/tests/test_ios_nonjb_exec_trace.py
          python3 tools/tests/test_ios_flex_stage2.py
          python3 tools/tests/test_ios_flex_stage3.py
          python3 tools/tests/test_ios_nonjb_link_dependencies.py
          python3 tools/tests/test_ios_custom_content.py
          cc -std=c11 -Wall -Wextra -Werror -Iport/ios/HaloIOS tools/tests/test_ios_flex_base_model.c -o "$RUNNER_TEMP/halo-flex-model-test"
          "$RUNNER_TEMP/halo-flex-model-test"
          cc -std=gnu11 -Wall -Wextra -Werror -DHALO_NON_JAILBREAK=1 -Iport/ios/HaloIOS -pthread -c port/ios/HaloIOS/halo_guest_runtime.c -o "$RUNNER_TEMP/halo-flex-runtime.o"
          python3 tools/tests/test_ios_log_export.py
          cc -std=c11 -Wall -Wextra -Werror tools/tests/test_ios_vertex_constants.c -o "$RUNNER_TEMP/halo-constants-test"
          "$RUNNER_TEMP/halo-constants-test"
          cc -std=c11 -Wall -Wextra -Werror -Iport/ios/HaloIOS tools/tests/test_ios_invite_file_policy.c -o "$RUNNER_TEMP/halo-invite-file-test"
          "$RUNNER_TEMP/halo-invite-file-test"
          python3 tools/tests/test_ios_first_person_remap.py
          python3 tools/tests/test_ios_geometry_mirror.py
          python3 tools/tests/test_ios_powerups.py
          python3 tools/tests/test_ios_world_cheats.py
          python3 tools/tests/test_ios_jetpack_jump.py
          python3 tools/tests/test_ios_store_build_modes.py
          python3 tools/tests/test_ios_header_declarations.py
          python3 tools/tests/test_ios_touch_aiming.py
          python3 tools/tests/test_ios_frameworks_linked.py
          python3 tools/tests/test_ios_import_coverage.py
          python3 tools/tests/test_ios_public_lobby.py
          python3 tools/tests/test_ios_upstream98.py
          python3 tools/tests/test_ios_sound_lifecycle.py
          python3 tools/tests/test_ios_upstream101.py
          python3 tools/tests/test_ios_campaign_policy.py
          python3 tools/tests/test_ios_arena_fastpath.py
          cc -std=c11 -Wall -Wextra -Werror -Iport/ios/HaloIOS tools/tests/test_ios_controls_layout.c -o "$RUNNER_TEMP/halo-controls-test" -lm
          "$RUNNER_TEMP/halo-controls-test"
          cc -std=c11 -Wall -Wextra -Wno-unused-function -pthread -D_GNU_SOURCE tools/tests/test_ios_fault_histogram.c -o "$RUNNER_TEMP/halo-hist-test"
          "$RUNNER_TEMP/halo-hist-test"
          cc -std=c11 -Wall -Wextra -Werror -Iport/ios/HaloIOS tools/tests/test_ios_settings_core.c -o "$RUNNER_TEMP/halo-settings-test" -lm
          "$RUNNER_TEMP/halo-settings-test"
          cc -std=c11 -Wall -Wextra -Werror -Iport/ios/HaloIOS tools/tests/test_ios_map_order.c -o "$RUNNER_TEMP/halo-maporder-test" -lm
          "$RUNNER_TEMP/halo-maporder-test"
          cc -std=c11 -Wall -Wextra -Werror -Iport/ios/HaloIOS tools/tests/test_ios_pad_input.c -o "$RUNNER_TEMP/halo-padinput-test" -lm
          "$RUNNER_TEMP/halo-padinput-test"
          cc -std=c11 -Wall -Wextra -Werror -Iport/ios/HaloIOS tools/tests/test_ios_color.c -o "$RUNNER_TEMP/halo-color-test" -lm
          "$RUNNER_TEMP/halo-color-test"
          cc -std=c11 -Wall -Wextra -Werror -Iport/ios/HaloIOS tools/tests/test_ios_scancodes.c -o "$RUNNER_TEMP/halo-scancodes-test"
          "$RUNNER_TEMP/halo-scancodes-test"
          cc -std=c11 -Wall -Wextra -Werror -Iport/ios/HaloIOS tools/tests/test_ios_log_classify.c -o "$RUNNER_TEMP/halo-log-test" -lm
          "$RUNNER_TEMP/halo-log-test"
          cc -std=c11 -Wall -Wextra -Werror -Iport/ios/HaloIOS tools/tests/test_ios_sdl_events.c -o "$RUNNER_TEMP/halo-events-test"
          "$RUNNER_TEMP/halo-events-test"
          cc -std=c11 -O2 -Wall -Wextra -Werror -pthread -Iport/ios/HaloIOS tools/tests/test_ios_audio_ring.c -o "$RUNNER_TEMP/halo-ring-test"
          "$RUNNER_TEMP/halo-ring-test"
          cc -std=gnu11 -Wall -Wextra -Wno-unused-function -Iport/ios/HaloIOS tools/tests/test_ios_net.c -o "$RUNNER_TEMP/halo-net-test"
          "$RUNNER_TEMP/halo-net-test"
          cc -std=c11 -O2 -Wall -Wextra -Werror -Iport/ios/HaloIOS tools/tests/test_ios_hash.c -o "$RUNNER_TEMP/halo-hash-test"
          "$RUNNER_TEMP/halo-hash-test"
          cc -std=gnu11 -Wall -Wextra -Wno-unused-function -Iport/ios/HaloIOS tools/tests/test_ios_launch_state.c -o "$RUNNER_TEMP/halo-launch-test"
          "$RUNNER_TEMP/halo-launch-test"
          cc -std=gnu11 -Wall -Wextra -Wno-unused-function tools/tests/test_ios_image_load.c -o "$RUNNER_TEMP/halo-image-test"
          "$RUNNER_TEMP/halo-image-test"
          cc -std=c11 -Wall -Wextra -Werror -Iport/ios/HaloIOS tools/tests/test_ios_log_report.c -o "$RUNNER_TEMP/halo-report-test" -lm
          "$RUNNER_TEMP/halo-report-test"
          cc -std=c11 -Wall -Wextra -Werror -Iport/ios/HaloIOS tools/tests/test_ios_frame_pacer.c -o "$RUNNER_TEMP/halo-pacer-test"
          "$RUNNER_TEMP/halo-pacer-test"
          cc -std=c11 -Wall -Wextra -Werror -Iport/ios/HaloIOS tools/tests/test_ios_vertex_colors.c -o "$RUNNER_TEMP/halo-vertex-test"
          "$RUNNER_TEMP/halo-vertex-test"
          cc -std=c11 -Wall -Wextra -Werror -Iport/ios/HaloIOS tools/tests/test_ios_vertex_attributes.c -o "$RUNNER_TEMP/halo-attribute-test"
          "$RUNNER_TEMP/halo-attribute-test"
          cc -std=c11 -Wall -Wextra -Werror -Iport/ios/HaloIOS tools/tests/test_ios_render_scans.c -o "$RUNNER_TEMP/halo-render-scan-test"
          "$RUNNER_TEMP/halo-render-scan-test"
          python3 tools/tests/test_ios_render_adapters.py
          cc -std=c11 -Wall -Wextra -Werror -Iport/ios/HaloIOS tools/tests/test_ios_scene_scans.c -o "$RUNNER_TEMP/halo-scene-scan-test"
          "$RUNNER_TEMP/halo-scene-scan-test"
          python3 tools/tests/test_ios_scene_adapters.py
          python3 -m venv "$RUNNER_TEMP/halo-arm-test"
          "$RUNNER_TEMP/halo-arm-test/bin/python" -m pip install unicorn==2.1.4 keystone-engine==0.9.2
          "$RUNNER_TEMP/halo-arm-test/bin/python" tools/tests/test_ios_pointer_fastpath.py

      - name: Cache Android guest third party
        uses: actions/cache@v4
        with:
          path: build/android/third_party
          key: ios-guest-third-party-${{ hashFiles('tools/android_build.py', 'tools/ios_gl_stubs.py') }}

      - name: Configure recovered arm64_32 guest
        env:
          ARENA_FASTPATH: ${{ github.event.inputs.arena_fastpath || 'true' }}
          COMPATIBILITY_TEST: ${{ inputs.compatibility_test || false }}
          NON_JAILBREAK: ${{ inputs.non_jailbreak || false }}
        run: |
          set -euxo pipefail
          python3 configure.py --pgo=off
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("build.ninja")
          # Ninja wraps long command lines with dollar-newline continuations.
          # Join those before matching the converter invocation.
          s = re.sub(r"\$\r?\n[ \t]*", "", p.read_text())
          if "tools/android_gl_stubs.py" not in s:
              raise SystemExit("android GL stub rule not found in build.ninja")
          if "-DHALO_ANDROID=1" not in s:
              raise SystemExit("guest compile flags not found in build.ninja")
          s = s.replace("-DHALO_ANDROID=1", "-DHALO_ANDROID=1 -DHALO_IOS_GUEST=1")
          import os
          non_jailbreak = os.environ.get("NON_JAILBREAK", "").lower() == "true"
          if os.environ.get("COMPATIBILITY_TEST", "").lower() == "true":
              s = s.replace("-DHALO_IOS_GUEST=1", "-DHALO_IOS_GUEST=1 -DHALO_MOD_TEST=1")
          if non_jailbreak:
              s = s.replace("-DHALO_IOS_GUEST=1", "-DHALO_IOS_GUEST=1 -DHALO_IOS_FLEX_BASE=1")
          fastpath = os.environ.get("ARENA_FASTPATH", "true").lower() != "false"
          if non_jailbreak and not fastpath:
              raise SystemExit("Non-Jailbreak Stage 3 requires the flexible-base pointer rewrite; leave arena_fastpath enabled")
          if fastpath:
              converter = "tools/android_asm_convert.py $out.darwin.s $out.s"
              target = "--target=arm64_32-apple-watchos"
              if converter not in s or target not in s:
                  raise SystemExit("converter invocation or guest target not found in build.ninja")
              import shutil, subprocess
              sample = (b"int f(int x){switch(x){case 1:return 3;case 2:return 5;case 3:return 9;"
                        b"case 4:return 1;case 7:return 6;case 9:return 2;}return 0;}\n")
              def probe(*flags):
                  # True/False for clang's verdict, None when clang is not installed (unit tests).
                  compiler = os.environ.get("GUEST_CC", "clang")
                  if shutil.which(compiler) is None:
                      return None
                  try:
                      run = subprocess.run([compiler, target, *flags, "-O2", "-S", "-x", "c", "-", "-o", os.devnull],
                                           input=sample, capture_output=True, timeout=120)
                  except (OSError, subprocess.SubprocessError):
                      return False
                  return run.returncode == 0
              if probe("-ffixed-x15") is False:
                  raise SystemExit("clang rejects -ffixed-x15 for the guest target")
              extra = " -ffixed-x15"
              if non_jailbreak:
                  if probe("-ffixed-x27") is False:
                      raise SystemExit("clang rejects -ffixed-x27 required by the Non-Jailbreak flexible-base guest")
                  extra += " -ffixed-x27"
              compressed_flag = None
              for flag in ("-aarch64-enable-compress-jump-tables=false",):
                  if probe("-mllvm", flag) is True:
                      compressed_flag = flag
                      extra += " -mllvm " + flag
                      print("guest build: compressed jump tables disabled via " + flag)
                      break
              if non_jailbreak and compressed_flag is None:
                  raise SystemExit("Non-Jailbreak Stage 3 requires compressed jump tables to be disabled")
              if compressed_flag is None:
                  print("guest build: clang has no known switch for compressed jump tables; "
                        "functions that use them stay on the signal bridge")
              if non_jailbreak:
                  s = s.replace(converter, "tools/android_asm_convert.py --ios-flex-base-fastpath $out.darwin.s $out.s")
              else:
                  s = s.replace(converter, "tools/android_asm_convert.py --ios-arena-fastpath $out.darwin.s $out.s")
              s = s.replace(target, target + extra)
          linker = "ld.lld -m aarch64linux -static"
          if linker not in s:
              raise SystemExit("guest link rule not found in build.ninja")
          s = s.replace(linker, linker + " --wrap=memcpy --wrap=memmove --wrap=memset")
          # iOS links the guest image at 0x90000000, not Android's 0x88000000, so that the Xbox memory window below it can be
          # 256 MiB (port/linux/src/platform.h, halo_port_capacity.h). The loader reads every address from the ELF file.
          original_script = Path("port/android/guest/guest.ld")
          if "port/android/guest/guest.ld" not in s or "0x88000000" not in original_script.read_text():
              raise SystemExit("guest linker script path or base address not found")
          ios_script = Path("build/ios_guest.ld")
          ios_script.parent.mkdir(parents=True, exist_ok=True)
          ios_script.write_text(original_script.read_text().replace("0x88000000", "0x90000000"))
          s = s.replace("port/android/guest/guest.ld", "build/ios_guest.ld")
          p.write_text(s.replace("tools/android_gl_stubs.py", "tools/ios_gl_stubs.py"))
          PY
          ninja --version
          clang --version

      - name: Verify SDL event layout against the SDL3 headers
        run: |
          set -euxo pipefail
          test -f build/android/third_party/SDL3/include/SDL3/SDL_events.h
          cc -std=c11 -Wall -Wextra -Werror -Ibuild/android/third_party/SDL3/include -Iport/ios/HaloIOS \
            tools/tests/test_ios_sdl_event_numbers.c -o "$RUNNER_TEMP/halo-sdl-numbers-test"
          "$RUNNER_TEMP/halo-sdl-numbers-test"

      - name: Build recovered Halo guest ELF
        run: |
          set -euxo pipefail
          ninja build/android/halo_guest.elf
          test -s build/android/halo_guest.elf
          file build/android/halo_guest.elf
          ls -lh build/android/halo_guest.elf

      - name: Upload guest image
        uses: actions/upload-artifact@v4
        with:
          name: HaloCE-iOS-Guest
          path: build/android/halo_guest.elf
          if-no-files-found: error
          retention-days: 1

  build-ios-app:
    name: Build and package iOS app
    if: github.ref == 'refs/heads/main'
    needs: build-arm64_32-guest
    runs-on: macos-latest
    timeout-minutes: 40
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4


      - name: Download recovered guest image
        uses: actions/download-artifact@v4
        with:
          name: HaloCE-iOS-Guest
          path: build/guest

      - name: Show Apple toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          clang --version
          ls -lh build/guest/halo_guest.elf

      - name: Verify Non-JB iPhoneOS runtime dependencies
        if: ${{ inputs.non_jailbreak }}
        run: |
          set -euxo pipefail
          python3 tools/tests/test_ios_nonjb_link_dependencies.py
          SDKROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos clang -std=gnu11 -Wall -Wextra -Werror \
            -target arm64-apple-ios15.0 -isysroot "$SDKROOT" \
            -DHALO_NON_JAILBREAK=1 -Iport/ios/HaloIOS \
            -c port/ios/HaloIOS/halo_guest_runtime.c \
            -o "$RUNNER_TEMP/halo-flex-runtime-ios.o"
          NONJB_UNDEFINED="$(xcrun nm -u "$RUNNER_TEMP/halo-flex-runtime-ios.o")"
          printf '%s\n' "$NONJB_UNDEFINED"
          printf '%s\n' "$NONJB_UNDEFINED" | grep -q 'sys_icache_invalidate'
          if printf '%s\n' "$NONJB_UNDEFINED" | grep -q 'clear_cache'; then
            echo "Non-JB iPhoneOS object unexpectedly depends on __clear_cache" >&2
            exit 1
          fi

      - name: Verify streaming backups and recovery
        run: |
          clang -fobjc-arc -DHALO_BACKUP_TEST -framework Foundation -Iport/ios/HaloIOS port/ios/HaloIOS/HaloBackupArchive.m tools/tests/test_ios_backup_archive.m -o "$RUNNER_TEMP/halo-backup-test"
          "$RUNNER_TEMP/halo-backup-test"

      - name: Verify automatic campaign recipes and map picture parsing
        run: |
          clang -fobjc-arc -DHALO_SETTINGS_TEST -framework Foundation -Iport/ios/HaloIOS port/ios/HaloIOS/HaloSettingsStore.m tools/tests/test_ios_preset_activation.m -o "$RUNNER_TEMP/halo-recipes-test"
          "$RUNNER_TEMP/halo-recipes-test"
          clang -fobjc-arc -DHALO_MAP_PICTURE_TEST -framework Foundation -Iport/ios/HaloIOS port/ios/HaloIOS/HaloMapPictures.m tools/tests/test_ios_map_pictures.m -lz -o "$RUNNER_TEMP/halo-pictures-test"
          "$RUNNER_TEMP/halo-pictures-test"

      - name: Verify Custom Edition library and legacy replacement migration
        run: |
          clang -fobjc-arc -DHALO_BACKUP_TEST -framework Foundation -Iport/ios/HaloIOS port/ios/HaloIOS/HaloMods.m port/ios/HaloIOS/HaloBackupArchive.m tools/tests/test_ios_mods.m -o "$RUNNER_TEMP/halo-mods-test"
          "$RUNNER_TEMP/halo-mods-test"

      - name: Verify disc extraction and cancellation
        run: |
          python3 tools/tests/test_ios_signing.py
          clang -std=c11 -Wall -Wextra -Werror -Iport/ios/HaloIOS tools/tests/test_ios_direct_arena.c -o "$RUNNER_TEMP/halo-direct-arena-test"
          "$RUNNER_TEMP/halo-direct-arena-test"
          clang -std=c11 -Wall -Wextra -Werror -Iport/ios/HaloIOS tools/tests/test_ios_runtime_failure.c -o "$RUNNER_TEMP/halo-runtime-diagnostics-test"
          "$RUNNER_TEMP/halo-runtime-diagnostics-test"
          clang -std=c11 -O2 -Wall -Wextra -Werror -Iport/ios/HaloIOS tools/tests/test_ios_texture_check.c -o "$RUNNER_TEMP/halo-texture-test"
          "$RUNNER_TEMP/halo-texture-test"
          clang -std=c11 -Wall -Wextra -Werror -Iport/ios/HaloIOS tools/tests/test_ios_coop_input.c -o "$RUNNER_TEMP/halo-coop-test"
          "$RUNNER_TEMP/halo-coop-test"
          python3 tools/tests/test_ios_xiso.py
          clang -fobjc-arc -DHALO_BACKUP_TEST -framework Foundation -Iport/ios/HaloIOS port/ios/HaloIOS/HaloDiscImport.m port/ios/HaloIOS/HaloBackupArchive.m tools/tests/test_ios_disc_install.m -o "$RUNNER_TEMP/halo-disc-test"
          "$RUNNER_TEMP/halo-disc-test"

      - name: Build device host app
        env:
          COMPATIBILITY_TEST: ${{ inputs.compatibility_test || false }}
          NON_JAILBREAK: ${{ inputs.non_jailbreak || false }}
        run: |
          set -euxo pipefail
          rm -rf build/ios
          HOST_FLAGS=('OTHER_CFLAGS=$(inherited)')
          if [ "$COMPATIBILITY_TEST" = true ]; then
            HOST_FLAGS=('OTHER_CFLAGS=$(inherited) -DHALO_ALIGNED_ARENA_TEST=1 -DHALO_MOD_TEST=1')
          elif [ "$NON_JAILBREAK" = true ]; then
            HOST_FLAGS=('OTHER_CFLAGS=$(inherited) -DHALO_NON_JAILBREAK=1')
          fi
          xcodebuild \
            -project port/ios/HaloIOS.xcodeproj \
            -scheme HaloIOS \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$PWD/build/ios/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            "${HOST_FLAGS[@]}" \
            build

      - name: Bundle real arm64_32 guest and ad-hoc sign
        env:
          COMPATIBILITY_TEST: ${{ inputs.compatibility_test || false }}
          NON_JAILBREAK: ${{ inputs.non_jailbreak || false }}
        run: |
          set -euxo pipefail
          APP=$(find build/ios/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -type d -print -quit)
          test -n "$APP"
          cp build/guest/halo_guest.elf "$APP/halo_guest.elf"
          cp port/assets/network/brokers.txt "$APP/brokers.txt"
          python3 tools/ios_notices.py "$APP/THIRD_PARTY_NOTICES.txt"
          test -s "$APP/THIRD_PARTY_NOTICES.txt"

          EXECUTABLE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP/Info.plist")
          test "$EXECUTABLE" = "HaloIOS"
          test -f "$APP/$EXECUTABLE"
          test -x "$APP/$EXECUTABLE"
          test -s "$APP/halo_guest.elf"
          # The Non-Jailbreak Version's code exists in the executable only when it was asked for, so an ordinary build is
          # proved to be without it. (The strings are read into a variable first: a pipe into grep -q would fail on SIGPIPE.)
          EXECUTABLE_STRINGS=$(/usr/bin/strings -a "$APP/$EXECUTABLE")
          GUEST_STRINGS=$(/usr/bin/strings -a "$APP/halo_guest.elf")
          if [ "$NON_JAILBREAK" = true ]; then
            grep -q -- 'Non-Jailbreak Version (' <<< "$EXECUTABLE_STRINGS" || grep -q -- 'Non-Jailbreak Version (Stage 3)' <<< "$EXECUTABLE_STRINGS"
            grep -q -- 'Address-space probe (nothing stays reserved)' <<< "$EXECUTABLE_STRINGS"
            grep -q -- 'Flexible 4 GiB ANYWHERE:' <<< "$EXECUTABLE_STRINGS"
            grep -q -- 'NON-JB EXECUTION TRACE:' <<< "$EXECUTABLE_STRINGS"
            grep -q -- 'NON-JB FLEX STAGE 3:' <<< "$EXECUTABLE_STRINGS"
            grep -q -- 'HALO_IOS_FLEX_BASE_GUEST_V1' <<< "$GUEST_STRINGS"
          elif grep -q -e 'Non-Jailbreak Version (' -e 'Non-Jailbreak Version (Stage 3)' -e 'Address-space probe (nothing stays reserved)' -e 'Flexible 4 GiB ANYWHERE:' -e 'NON-JB EXECUTION TRACE:' -e 'NON-JB FLEX STAGE 3:' <<< "$EXECUTABLE_STRINGS" || grep -q -- 'HALO_IOS_FLEX_BASE_GUEST_V1' <<< "$GUEST_STRINGS"; then
            echo "::error::Non-Jailbreak code is present in a build that did not ask for it."
            exit 1
          fi
          # The same proof for the Mod Test app: its engine and host code exist only in a build that asked for it.
          if [ "$COMPATIBILITY_TEST" = true ]; then
            grep -q -- 'MOD TEST:' <<< "$GUEST_STRINGS"
            grep -q -- 'Mod Test build:' <<< "$EXECUTABLE_STRINGS"
          elif grep -q -e 'MOD TEST:' <<< "$GUEST_STRINGS" || grep -q -- 'Mod Test build:' <<< "$EXECUTABLE_STRINGS"; then
            echo "::error::Mod Test code is present in a build that did not ask for it."
            exit 1
          fi
          if [ "$COMPATIBILITY_TEST" = true ]; then
            /usr/libexec/PlistBuddy -c 'Set :CFBundleIdentifier com.haloceuniversal.ios.modtest' "$APP/Info.plist"
            /usr/libexec/PlistBuddy -c 'Set :CFBundleName Halo CE Mod Test' "$APP/Info.plist"
            /usr/libexec/PlistBuddy -c 'Set :CFBundleURLTypes:0:CFBundleURLName com.haloceuniversal.ios.modtest.invite' "$APP/Info.plist"
            /usr/libexec/PlistBuddy -c 'Set :CFBundleDisplayName Halo CE Mod Test' "$APP/Info.plist"
            # the Mod Test app's version is the official one with a trailing .1 (0.2.92 / 2692 becomes 0.2.92.1 / 269201)
            OFFICIAL_SHORT=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")
            OFFICIAL_BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${OFFICIAL_SHORT}.1" "$APP/Info.plist"
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${OFFICIAL_BUILD}01" "$APP/Info.plist"
            /usr/libexec/PlistBuddy -c 'Set :CFBundleURLTypes:0:CFBundleURLSchemes:0 halomodtest' "$APP/Info.plist"
          fi

          GUEST_SHA=$(/usr/bin/shasum -a 256 "$APP/halo_guest.elf" | awk '{print $1}')
          FLAVOR=Regular
          DIAGNOSTICS=none
          GUEST_ARCHITECTURE=aligned-arena-v1
          GUEST_ADAPTATION=ios-guarded-v1
          if [ "$COMPATIBILITY_TEST" = true ]; then
            FLAVOR=ModTest
            DIAGNOSTICS=direct-aligned-arena-test
          elif [ "$NON_JAILBREAK" = true ]; then
            FLAVOR=NonJailbreak
            DIAGNOSTICS=flex-base-stage3-real-guest+exec-trace-v3
            GUEST_ARCHITECTURE=flexible-base-x27-v1
            GUEST_ADAPTATION=ios-flex-x27-v1
          fi
          /usr/libexec/PlistBuddy -c "Set :HaloBuildFlavor $FLAVOR" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :HaloDiagnosticMode $DIAGNOSTICS" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :HaloGuestArchitecture $GUEST_ARCHITECTURE" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :HaloGuestAdaptation $GUEST_ADAPTATION" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :HaloGuestSHA256 $GUEST_SHA" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :HaloSourceCommit ${GITHUB_SHA:-local}" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :HaloBuildRun ${GITHUB_RUN_ID:-local}" "$APP/Info.plist"

          if [ "$NON_JAILBREAK" = true ]; then
            ENTITLEMENTS=port/ios/HaloIOS/HaloIOS-NonJailbreak.entitlements
            SIGNING_CHECK=(python3 tools/verify_ios_signing.py --require-absent-memory "$APP")
          else
            ENTITLEMENTS=port/ios/HaloIOS/HaloIOS.entitlements
            SIGNING_CHECK=(python3 tools/verify_ios_signing.py "$APP")
          fi
          /usr/bin/codesign --force --sign - \
            --entitlements "$ENTITLEMENTS" \
            --timestamp=none "$APP"
          /usr/bin/codesign --verify --verbose=2 "$APP"
          "${SIGNING_CHECK[@]}"
          python3 tools/verify_ios_icons.py "$APP"

      - name: Package HaloCE.ipa
        env:
          NON_JAILBREAK: ${{ inputs.non_jailbreak || false }}
        run: |
          set -euxo pipefail
          APP=$(find build/ios/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -type d -print -quit)
          test -n "$APP"
          rm -rf build/ios/Payload
          mkdir -p build/ios/Payload
          cp -R "$APP" build/ios/Payload/
          cd build/ios
          /usr/bin/zip -qry HaloCE.ipa Payload
          /usr/bin/unzip -Z1 HaloCE.ipa | grep -qx 'Payload/HaloIOS.app/Info.plist'
          /usr/bin/unzip -Z1 HaloCE.ipa | grep -qx 'Payload/HaloIOS.app/HaloIOS'
          /usr/bin/unzip -Z1 HaloCE.ipa | grep -qx 'Payload/HaloIOS.app/halo_guest.elf'
          /usr/bin/unzip -Z1 HaloCE.ipa | grep -qx 'Payload/HaloIOS.app/THIRD_PARTY_NOTICES.txt'
          if [ "$NON_JAILBREAK" = true ]; then
            mv HaloCE.ipa HaloCE-NonJailbreak.ipa
          fi

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.non_jailbreak && 'HaloCE-iOS-NonJailbreak' || inputs.compatibility_test && 'HaloCE-iOS-ModTest' || 'HaloCE-iOS' }}
          path: build/ios/${{ inputs.non_jailbreak && 'HaloCE-NonJailbreak.ipa' || 'HaloCE.ipa' }}
          if-no-files-found: error
          retention-days: 14
